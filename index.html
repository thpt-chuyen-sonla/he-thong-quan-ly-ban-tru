<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nền tảng Quản trị Bán trú Trường học</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            height: 100dvh; /* Chiều cao an toàn của Safari */
            width: 100vw;
            overflow: hidden;
            background-color: #1e1e2f;
            display: flex;
        }

        /* Thanh điều hướng Máy tính (Bên trái) */
        .platform-sidebar {
            width: 250px; height: 100%; background-color: #1e1e2f; color: white;
            display: flex; flex-direction: column; z-index: 1000;
        }
        .platform-logo {
            padding: 20px; font-size: 18px; font-weight: bold; border-bottom: 1px solid #2a2a40;
            display: flex; align-items: center; gap: 10px; color: #4ade80;
        }
        .platform-menu { display: flex; flex-direction: column; padding: 15px 0; flex: 1; }
        .menu-item {
            padding: 15px 20px; color: #a0a0b0; text-decoration: none; display: flex;
            align-items: center; gap: 15px; cursor: pointer; transition: all 0.3s;
            border-left: 4px solid transparent;
        }
        .menu-item:hover { background-color: #2a2a40; color: white; }
        .menu-item.active { background-color: #2a2a40; color: white; border-left-color: #4ade80; font-weight: 600; }
        .platform-footer { padding: 20px; font-size: 12px; color: #6a6a80; border-top: 1px solid #2a2a40; text-align: center; }

        /* Khung chứa ứng dụng Máy tính */
        .platform-content {
            flex: 1; height: 100%; position: relative; background-color: #f3f4f6;
        }
        .app-frame {
            width: 100%; height: 100%; border: none; position: absolute;
            top: 0; left: 0; display: none;
        }
        .app-frame.active { display: block; }

        /* === TỐI ƯU RIÊNG CHO ĐIỆN THOẠI === */
        @media (max-width: 768px) {
            body { display: block; }
            
            /* Khung ứng dụng bị ép ngắn lại, nhường chỗ cho Menu đáy */
            .platform-content {
                width: 100%; 
                height: calc(100dvh - 65px - env(safe-area-inset-bottom)); 
                position: absolute; top: 0; left: 0;
            }

            /* Menu đóng đinh dưới đáy */
            .platform-sidebar {
                position: fixed; bottom: 0; left: 0; width: 100%; 
                height: calc(65px + env(safe-area-inset-bottom));
                padding-bottom: env(safe-area-inset-bottom);
                flex-direction: row; box-shadow: 0 -4px 15px rgba(0,0,0,0.15);
            }
            .platform-logo, .platform-footer { display: none; }
            .platform-menu { flex-direction: row; padding: 0; width: 100%; }
            .menu-item {
                flex-direction: column; gap: 4px; padding: 8px; font-size: 11px;
                border-left: none; border-top: 3px solid transparent; flex: 1; 
                text-align: center; justify-content: center; height: 100%;
            }
            .menu-item i { font-size: 18px; margin-bottom: 2px; }
            .menu-item.active { border-top-color: #4ade80; background-color: rgba(255,255,255,0.05); }
        }
    </style>
</head>
<body>
    <nav class="platform-sidebar">
        <div class="platform-logo"><i class="fa-solid fa-school"></i> Hệ sinh thái Bán trú</div>
        <div class="platform-menu">
            <div class="menu-item active" onclick="switchApp('app-quan-ly', this)">
                <i class="fa-solid fa-users"></i><span>Quản lý Học sinh</span>
            </div>
            <div class="menu-item" onclick="switchApp('app-xep-lich', this)">
                <i class="fa-solid fa-calendar-alt"></i><span>Phân công Lịch trực</span>
            </div>
        </div>
        <div class="platform-footer">THPT Chuyên Sơn La<br>Năm học 2026-2027</div>
    </nav>

    <main class="platform-content">
        <iframe src="quan-ly.html" id="app-quan-ly" class="app-frame active"></iframe>
        <iframe src="xep-lich.html" id="app-xep-lich" class="app-frame"></iframe>
    </main>

    <script>
        function switchApp(appId, menuItem) {
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
            menuItem.classList.add('active');
            document.querySelectorAll('.app-frame').forEach(frame => frame.classList.remove('active'));
            document.getElementById(appId).classList.add('active');
        }
    </script>
</body>
</html>
